[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pim-calculator"
version = "0.3"
description = "Passive Intermodulation Calculator for RF antennas"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Unlicense" }
authors = [
    { name = "Jacek Kreft" }
]
dependencies = [
    "numpy>=1.13.3",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-benchmark[histogram]",
    "pytest-mock",
    "pytest-cov",
    "scipy",
    "matplotlib>=2.0",
]
gui = [
    "PySide6",
    "scipy>=1.0",
    "matplotlib>=2.0",
]

[project.scripts]
PIM_Calculator = "PIM_Calculator.pim_calc:main"
PIM_GUI_Calculator = "PIM_Calculator.pimQt:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-benchmark[histogram]",
    "pytest-cov",
    "pytest-mock",
    "pytest-qt",
    "pytest-xvfb",
    "ruff",
    "mypy",
    "bandit",
    "scipy",
    "matplotlib>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["PIM_Calculator/tests"]
python_files = ["test_pim_calc.py"]
markers = ["benchmark: performance benchmarks"]

[tool.ruff.lint]
# E741: single-letter carrier indices (i,j,k,l,m) are domain convention
#       in the intermodulation product loops.
select = ["E4", "E7", "E9", "F", "UP"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "PySide2.*", "pytestqt.*", "scipy.*", "matplotlib.backends.*"]
ignore_missing_imports = true
