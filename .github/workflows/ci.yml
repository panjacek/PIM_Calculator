name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- flavour: python -----------------------------------------------------
  python-lint:
    name: python / lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync python env
        run: uv sync --project python --group dev
      - name: Ruff
        run: make lint-python

  python-unit:
    name: python / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync python env
        run: uv sync --project python --group dev
      - name: Pytest (unit)
        run: make test-python-unit

  # --- flavour: go ---------------------------------------------------------
  go-lint:
    name: go / lint (vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Go vet
        run: make lint-go

  go-test:
    name: go / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Go test
        run: make test-go

  # --- flavour: mojo -------------------------------------------------------
  mojo-lint:
    name: mojo / lint (mblack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync root env (mojo toolchain + pim-calculator)
        run: uv sync --group dev
      - name: mblack
        run: make lint-mojo

  # GUI tests are slow and X-dependent: only run once code is proven sound.
  python-gui:
    name: python / gui tests (xvfb)
    needs: [python-lint, python-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync python env (gui extras)
        run: uv sync --project python --extra gui
      - name: Install xvfb and Qt/XGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb x11-utils libegl1 libgl1 libglib2.0-0 libfontconfig1 \
            libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0
      - name: Pytest (gui under xvfb)
        run: xvfb-run --auto-servernum make test-python-gui

  # Mojo wraps the python library: only build/test it against validated code,
  # and only after its own lint passes.
  mojo-test:
    name: mojo / unit tests
    needs: [mojo-lint, python-lint, python-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync root env (mojo toolchain + pim-calculator)
        run: uv sync --group dev
      - name: Mojo test suite
        run: make test-mojo

  # --- integration ---------------------------------------------------------
  integration:
    name: integration / cross-flavour CLI comparison
    needs:
      - python-lint
      - python-unit
      - python-gui
      - go-lint
      - go-test
      - mojo-lint
      - mojo-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Sync root env (python lib + mojo toolchain)
        run: uv sync --group dev
      - name: Build go CLI
        run: make build-go
      - name: Run all three CLIs on canonical case (TX 2152,1932 / RX 1752,1900)
        run: |
          set -euo pipefail
          ( cd python && uv run --project . PIM_Calculator 2152,1932 --rx_list=1752,1900 ) > /tmp/python.out
          ./go/pim_calc -tx_band "5,5" -rx_list "1752,1900" 2152,1932 > /tmp/go.out
          ( cd mojo && uv run mojo run -I . pim_calc.mojo 2152,1932 -r 1752,1900 ) > /tmp/mojo.out
      - name: Compare computed PIM frequencies across flavours
        run: |
          set -euo pipefail
          EXPECTED="1492 1712 1932 2152 2372 2592"
          status=0
          for f in /tmp/python.out /tmp/go.out /tmp/mojo.out; do
            for v in $EXPECTED; do
              if ! grep -q "$v" "$f"; then
                echo "::error::${f}: expected IM frequency ${v} MHz missing"
                status=1
              fi
            done
          done
          exit $status
