name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- flavour: python -----------------------------------------------------
  python-lint:
    name: python / lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Sync python env
        run: uv sync --project python --group dev
      - name: Ruff
        run: make lint-python

  python-unit:
    name: python / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Sync python env
        run: uv sync --project python --group dev
      - name: Pytest (unit, with coverage)
        run: make test-python-unit
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-python
          path: python/coverage.xml
          if-no-files-found: warn

  # --- flavour: go ---------------------------------------------------------
  go-lint:
    name: go / lint (vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Go vet
        run: make lint-go

  go-test:
    name: go / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Go test
        run: make test-go

  # --- flavour: mojo -------------------------------------------------------
  mojo-lint:
    name: mojo / lint (mblack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Sync root env (mojo toolchain + pim-calculator)
        run: uv sync --group dev
      - name: mblack
        run: make lint-mojo

  # GUI tests are slow and X-dependent: only run once code is proven sound.
  python-gui:
    name: python / gui tests (xvfb)
    needs: [python-lint, python-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Sync python env (gui extras)
        run: uv sync --project python --extra gui
      - name: Install xvfb and Qt/XGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb x11-utils libegl1 libgl1 libglib2.0-0 libfontconfig1 \
            libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0
      - name: Pytest (gui under xvfb)
        run: xvfb-run --auto-servernum make test-python-gui

  # Mojo wraps the python library: only build/test it against validated code,
  # and only after its own lint passes.
  mojo-test:
    name: mojo / unit tests
    needs: [mojo-lint, python-lint, python-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Sync root env (mojo toolchain + pim-calculator)
        run: uv sync --group dev
      - name: Mojo test suite
        run: make test-mojo

  # --- integration ---------------------------------------------------------
  integration:
    name: integration / cross-flavour CLI comparison
    needs:
      - python-gui
      - go-lint
      - go-test
      - mojo-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Sync root env (python lib + mojo toolchain)
        run: uv sync --group dev
      - name: Build go CLI
        run: make build-go
      - name: Cross-flavour comparison (TX 2152,1932 / RX 1752,1900)
        run: make test-integration
