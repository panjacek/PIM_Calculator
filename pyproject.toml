[project]
name = "pim-calculator-mojo"
version = "0.4"
description = "Mojo integration environment for Passive Intermodulation Calculator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Unlicense" }
authors = [
    { name = "Jacek Kreft" }
]
dependencies = [
    "mojo==1.0.0",
    "numpy>=1.13.3",
    "pim-calculator",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "bandit",
]

[tool.uv]
package = false

[tool.uv.sources]
pim-calculator = { path = "python", editable = true }

[tool.ruff.lint]
# N999: project module naming convention.
# E741: single-letter carrier indices (i,j,k,l,m) are domain convention
#       in the intermodulation product loops.
select = ["E4", "E7", "E9", "F", "UP"]
ignore = ["N999", "E741"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "PySide2.*", "pytestqt.*", "scipy.*", "matplotlib.backends.*"]
ignore_missing_imports = true
