[project]
name = "pim-calculator-mojo"
version = "0.2"
description = "Mojo integration environment for Passive Intermodulation Calculator"
readme = "Readme.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
authors = [
    { name = "Jacek Kreft" }
]
dependencies = [
    "mojo==1.0.0",
    "numpy>=1.13.3",
    "pim-calculator",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
pim-calculator = { path = "python", editable = true }

[tool.ruff.lint]
ignore = ["N999"]
